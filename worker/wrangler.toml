name = "locket-gold"
main = "src/index.js"
compatibility_date = "2024-09-01"

[[kv_namespaces]]
binding = "CAPTURE"
id = "28b76e3aaf764576bcc972add08a30d8"

# KV namespace cho photobooth session storage
# Tạo: npx wrangler kv namespace create KV_STORE
# Rồi paste ID vào đây
# [[kv_namespaces]]
# binding = "KV_STORE"
# id = "YOUR_KV_NAMESPACE_ID"

# R2 bucket cho lưu ảnh (optional, nếu không có thì trả data URL)
# Tạo: npx wrangler r2 bucket create locket-gold-images
# [[r2_buckets]]
# binding = "R2_BUCKET"
# bucket_name = "locket-gold-images"

# Secret: set bằng command line
# npx wrangler secret put GEMINI_API_KEY

[vars]
# R2_PUBLIC_URL = "https://your-r2-custom-domain.com"
# ECHO_TEST đã TẮT: filter chạy generate thật (shopaikey). Bật lại "1" nếu cần test cơ chế.
# Model: gemini-2.5-flash-image = shopaikey CÓ channel, curl ra ảnh PNG 1024 thật (~14-16s).
# gemini-3.1-flash-lite-image = 503 model_not_found (không có channel). gemini-3-pro-image-preview
# có thể thử nếu cần đẹp hơn.
SHOPAIKEY_MODEL = "gemini-2.5-flash-image"
